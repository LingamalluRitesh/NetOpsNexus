[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-nexus"
version = "1.0.0"
description = "Enterprise Network Intelligence, Automation & Observability Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "NetOps Nexus Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "networkx>=3.3",
    "scipy>=1.14.0",
    "numpy>=1.26.0",
    "websockets>=13.1",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "paramiko>=3.5.0",
    "asyncssh>=2.17.0",
    "pysnmp>=4.4.12",
    "scapy>=2.5.0",
    "netaddr>=1.3.0",
    "reportlab>=4.2.5",
    "pandas>=2.2.3",
    "python-dateutil>=2.9.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "black>=24.8.0",
    "isort>=5.13.2",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["tests/*", "venv/*", ".venv/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "__pycache__", "venv", ".venv", "dist", "build"]
