version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netops_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-netops_nexus}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netops -d netops_nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: netops-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-netops}:${POSTGRES_PASSWORD:-netops_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-netops_nexus}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-netops}:${POSTGRES_PASSWORD:-netops_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-netops_nexus}
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=true
      - LAB_MODE=true
      - SECRET_KEY=${SECRET_KEY:-netops-nexus-dev-secret-key-change-in-production-minimum-32-chars}
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: netops-worker
    restart: unless-stopped
    command: ["python", "-m", "backend.app.workers.scheduler"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-netops}:${POSTGRES_PASSWORD:-netops_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-netops_nexus}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-netops}:${POSTGRES_PASSWORD:-netops_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-netops_nexus}
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=true
      - LAB_MODE=true
      - SECRET_KEY=${SECRET_KEY:-netops-nexus-dev-secret-key-change-in-production-minimum-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: netops-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
